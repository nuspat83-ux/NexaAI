name: NexaAI Vercel Smoke

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify Vercel homepage and API health
        run: |
          set -euo pipefail
          export VERCEL_URL=https://nexa-ai-git-main-nuspat83-9991.vercel.app
          for attempt in $(seq 1 60); do
            code=$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$VERCEL_URL/" || true)
            api=$(curl -sS -L -o /tmp/health.json -w '%{http_code}' "$VERCEL_URL/api/health" || true)
            if [ "$code" = 200 ] && [ "$api" = 200 ] && grep -q 'id="root"' /tmp/home.html && grep -q '"ok"[[:space:]]*:[[:space:]]*true' /tmp/health.json; then
              echo "VERCEL_URL=$VERCEL_URL" >> "$GITHUB_ENV"
              echo "Homepage HTTP $code; API health HTTP $api"
              cat /tmp/health.json
              exit 0
            fi
            echo "Waiting for Vercel: home=$code api=$api attempt=$attempt"
            sleep 5
          done
          echo "Public Vercel deployment did not return the expected homepage/API responses."
          echo "Homepage response:"; head -c 1000 /tmp/home.html || true
          echo "API response:"; head -c 1000 /tmp/health.json || true
          exit 1

      - name: Verify API error boundaries
        run: |
          set -euo pipefail
          unknown=$(curl -sS -o /tmp/unknown.json -w '%{http_code}' "$VERCEL_URL/api/no-such-route")
          test "$unknown" = 404
          grep -q '"error":"Not found"' /tmp/unknown.json
          invalid=$(curl -sS -o /tmp/invalid.json -w '%{http_code}' -X POST "$VERCEL_URL/api/generate" -H 'Content-Type: application/json' --data '{"businessName":"Smoke Test"}')
          test "$invalid" = 400
          grep -q '"error":"Invalid builder configuration"' /tmp/invalid.json
          echo "API boundary checks passed: invalid route=404, invalid builder configuration=400"
      
      - name: Install Playwright for browser smoke
        run: npm install --no-save --package-lock=false playwright@latest

      - name: Install Playwright Chromium
        run: npx playwright@latest install --with-deps chromium

      - name: Verify homepage and builder
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > .nexaai-smoke.spec.mjs
          sed -i "s/networkkide/domcontentloaded/" .nexaai-smoke.spec.mjs
          sed -i "s/\.getByRole('button', { name: 'Start building' }).click()/\.getByRole('button', { name: 'Start building' }).first().click()/" .nexaai-smoke.spec.mjs
          npx playwright@latest test .nexaai-smoke.spec.mjs --reporter=line

      - name: Publish smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state="failure"
          if [ "$JOB_STATUS" = "success" ]; then state="success"; fi
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -n --arg state "$state" '{state:$state,context:"NexaAI smoke",description:"Build, tests, Vercel API boundary and browser smoke"}')"
