name: NexaAI Vercel Smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify Vercel homepage and API health
        run: |
          set -euo pipefail
          export VERCEL_URL=https://nexa-ai-git-main-nuspat83-9991.vercel.app
          for attempt in $(seq 1 60); do
            code=$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$VERCEL_URL/" || true)
            api=$(curl -sS -L -o /tmp/health.json -w '%{http_code}' "$VERCEL_URL/api/health" || true)
            if [ "$code" = 200 ] && [ "$api" = 200 ] && grep -q 'id="root"' /tmp/home.html && grep -q '"ok"[[:space:]]*:[[:space:]]*true' /tmp/health.json; then
              echo "VERCEL_URL=$VERCEL_URL" >> "$GITHUB_ENV"
              echo "Homepage HTTP $code; API health HTTP $api"
              cat /tmp/health.json
              exit 0
            fi
            echo "Waiting for Vercel: home=$code api=$api attempt=$attempt"
            sleep 5
          done
          echo "Public Vercel deployment did not return the expected homepage/API responses."
          echo "Homepage response:"; head -c 1000 /tmp/home.html || true
          echo "API response:"; head -c 1000 /tmp/health.json || true
          exit 1

      - name: Verify API error boundaries
        run: |
          set -euo pipefail
          unknown=$(curl -sS -o /tmp/unknown.json -w '%{http_code}' "$VERCEL_URL/api/no-such-route")
          test "$unknown" = 404
          grep -q '"error":"Not found"' /tmp/unknown.json
          gemini=$(curl -sS -o /tmp/gemini.json -w '%{http_code}' -X POST "$VERCEL_URL/api/generate" -H 'Content-Type: application/json' --data '{"businessName":"Smoke Test"}')
          if [ "$gemini" = 503 ]; then
            grep -q 'GEMINI_API_KEY is not configured' /tmp/gemini.json
          else
            echo "Expected missing-Gemini deployment to return 503, got $gemini"
            cat /tmp/gemini.json
            exit 1
          fi
          echo "API boundary checks passed: invalid route=404, missing Gemini=503"
      
      - name: Install Playwright Chromium
        run: npx playwright@latest install --with-deps chromium

      - name: Verify homepage and builder
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/nexaai-smoke.spec.mjs <<'EOF'
          import { test, expect } from 'playwright/test';
          test('NexaAI homepage and builder have no immediate runtime errors', async ({ page }) => {
            const errors = [];
            page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
            page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });
            await page.goto(process.env.VERCEL_URL, { waitUntil: 'networkidle', timeout: 30000 });
            await expect(page.getByText('NexaAI', { exact: true }).first()).toBeVisible();
            await expect(page.getByRole('heading', { name: 'Make your business look the part.' })).toBeVisible();
            await page.getByRole('button', { name: 'Start building' }).click();
            await expect(page.getByText('Category', { exact: true }).first()).toBeVisible();
            await expect(page.getByText('Business', { exact: true }).first()).toBeVisible();
            expect(errors, errors.join('\\n')).toEqual([]);
          });
          EOF
          npx playwright@latest test /tmp/nexaai-smoke.spec.mjs --reporter=line
