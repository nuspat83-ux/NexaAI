name: NexaAI Vercel Smoke

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: read
  statuses: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wait for Vercel deployment and discover URL
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}&per_page=20"
          for attempt in $(seq 1 60); do
            deployments=$(curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "$api")
            for id in $(echo "$deployments" | jq -r '.[] | select(.creator.login == "vercel" or .creator.login == "vercel[bot]") | .id'); do
              detail=$(curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${id}")
              environment_url=$(echo "$detail" | jq -r '.environment_url // empty')
              statuses=$(curl -sS -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses?per_page=20")
              state=$(echo "$statuses" | jq -r '.[0].state // empty')
              if [ -n "$environment_url" ] && [ "$state" = "success" ]; then
                echo "VERCEL_URL=$environment_url" >> "$GITHUB_ENV"
                echo "Discovered Vercel deployment: $environment_url"
                exit 0
              fi
            done
            echo "No ready Vercel deployment discovered yet (attempt $attempt)."
            sleep 5
          done
          echo "No public NexaAI Vercel deployment URL was exposed by GitHub for this commit."
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright@latest install --with-deps chromium

      - name: Verify homepage and builder
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/nexaai-smoke.spec.mjs <<'EOF'
          import { test, expect } from 'playwright/test';

          test('homepage loads, builder opens, and page has no immediate runtime errors', async ({ page }) => {
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(`console: ${message.text()}`);
            });

            await page.goto(process.env.VERCEL_URL, {
              waitUntil: 'networkidle',
              timeout: 30_000,
            });
            await expect(page.getByText('NexaAI', { exact: true }).first()).toBeVisible();
            await expect(page.getByRole('heading', { name: 'Make your business look the part.' })).toBeVisible();

            await page.getByRole('button', { name: 'Start building' }).click();
            await expect(page.getByText('Category', { exact: true }).first()).toBeVisible();
            await expect(page.getByText('Business', { exact: true }).first()).toBeVisible();

            expect(errors, errors.join('\n')).toEqual([]);
          });
          EOF
          npx playwright@latest test /tmp/nexaai-smoke.spec.mjs --reporter=line
