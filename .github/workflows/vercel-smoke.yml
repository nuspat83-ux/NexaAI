name: NexaAI Vercel Smoke

on:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify Vercel homepage and API health
        run: |
          set -euo pipefail
          export VERCEL_URL=https://nexa-ai-git-main-nuspat83-9991.vercel.app
          for attempt in $(seq 1 60); do
            code=$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$VERCEL_URL/" || true)
            api=$(curl -sS -L -o /tmp/health.json -w '%{http_code}' "$VERCEL_URL/api/health" || true)
            if [ "$code" = 200 ] && [ "$api" = 200 ] && grep -q 'id="root"' /tmp/home.html && grep -q '"ok"[[:space:]]*:[[:space:]]*true' /tmp/health.json; then
              echo "VERCEL_URL=$VERCEL_URL" >> "$GITHUB_ENV"
              echo "Homepage HTTP $code; API health HTTP $api"
              cat /tmp/health.json
              exit 0
            fi
            echo "Waiting for Vercel: home=$code api=$api attempt=$attempt"
            sleep 5
          done
          echo "Public Vercel deployment did not return the expected homepage/API responses."
          echo "Homepage response:"; head -c 1000 /tmp/home.html || true
          echo "API response:"; head -c 1000 /tmp/health.json || true
          exit 1

      - name: Verify live Gemini configuration and generation request
        run: |
          set -euo pipefail
          grep -q '"aiConfigured"[[:space:]]*:[[:space:]]*true' /tmp/health.json
          code=$(curl -sS -o /tmp/direct-plan.json -w '%{http_code}' -X POST "$VERCEL_URL/api/direct-plan" \
            -H 'Content-Type: application/json' \
            --data '{"brief":"Create a simple mobile-friendly cafe website in Mumbai with a menu and WhatsApp ordering."}')
          echo "Live /api/direct-plan HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Safe Gemini diagnostic response:"
            head -c 2000 /tmp/direct-plan.json || true
            exit 1
          fi
          grep -q '"category"' /tmp/direct-plan.json
          grep -q '"catalogMode"' /tmp/direct-plan.json
          echo "Live Gemini planning request succeeded; server reports GEMINI_API_KEY configured."
          echo "Response fields verified without exposing credentials."
      
      - name: Verify live website generation request
        run: |
          set -euo pipefail
          cat > /tmp/generation-state.json <<'EOF'
          {
            "creationMode":"direct",
            "directBrief":"Create a simple mobile-friendly cafe website in Mumbai with a menu and WhatsApp ordering.",
            "businessDetails":{},
            "catalog":{"mode":"menu","products":[{"id":"smoke-menu-1","name":"Masala Chai","price":120,"category":"Drinks","images":[]}],"services":[],"payment":"whatsapp","orderFlow":"whatsapp","delivery":{"areas":"Mumbai"}},
            "category":"Cafe",
            "customBusiness":"",
            "businessName":"NexaAI Smoke Cafe",
            "tagline":"A simple cafe website.",
            "description":"A cafe website used for production generation request verification.",
            "location":"Mumbai",
            "phone":"",
            "whatsapp":"",
            "email":"",
            "address":"",
            "hours":"Daily",
            "socials":"",
            "existingWebsite":"",
            "styles":["Modern"],
            "primary":"#111111",
            "secondary":"#FFFFFF",
            "font":"Inter",
            "theme":"ai",
            "sections":["Hero","Menu","Contact"],
            "pages":["Home","Menu","Contact"],
            "features":["WhatsApp button"],
            "assets":[],
            "brief":"A simple mobile-friendly cafe website.",
            "audience":"Local cafe customers",
            "plan":"Starter"
          }
          EOF
          code=$(curl -sS -o /tmp/generation-create.json -w '%{http_code}' -X POST "$VERCEL_URL/api/generate" -H 'Content-Type: application/json' --data-binary @/tmp/generation-state.json)
          test "$code" = 202
          grep -q '"status":"GENERATING"' /tmp/generation-create.json
          grep -q '"projectId"' /tmp/generation-create.json
          grep -q '"accessToken"' /tmp/generation-create.json
          echo "Live /api/generate request accepted with HTTP 202 and entered GENERATING state."
          echo "Completion polling is intentionally not used here because the existing Vercel store is instance-local ephemeral state."
      
      - name: Verify API error boundaries
        run: |
          set -euo pipefail
          unknown=$(curl -sS -o /tmp/unknown.json -w '%{http_code}' "$VERCEL_URL/api/no-such-route")
          test "$unknown" = 404
          grep -q '"error":"Not found"' /tmp/unknown.json
          invalid=$(curl -sS -o /tmp/invalid.json -w '%{http_code}' -X POST "$VERCEL_URL/api/generate" -H 'Content-Type: application/json' --data '{"businessName":"Smoke Test"}')
          test "$invalid" = 400
          grep -q '"error":"Invalid builder configuration"' /tmp/invalid.json
          echo "API boundary checks passed: invalid route=404, invalid builder configuration=400"
      
      - name: Install Playwright for browser smoke
        run: npm install --no-save --package-lock=false playwright@latest

      - name: Install Playwright Chromium
        run: npx playwright@latest install --with-deps chromium

      - name: Verify homepage and builder
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > .nexaai-smoke.spec.mjs
          sed -i "s/networkkide/domcontentloaded/" .nexaai-smoke.spec.mjs
          sed -i "9c\\  await page.locator('.nav-cta').click();" .nexaai-smoke.spec.mjs
          sed -i "11c\\  await expect(page.getByText('NexaAI Direct', { exact: true })).toBeVisible();" .nexaai-smoke.spec.mjs
          sed -i "s/\.getByRole('button', { name: 'Start building' }).click()/\.getByRole('button', { name: 'Start building' }).first().click()/" .nexaai-smoke.spec.mjs
          npx playwright@latest test .nexaai-smoke.spec.mjs --reporter=line

      - name: Verify responsive application layout
        shell: bash
        run: |
          set -euo pipefail
          cat > .nexaai-responsive.spec.mjs <<'EOF'
          import { test, expect } from 'playwright/test';
          const viewports = [
            { name: 'mobile', width: 390, height: 844 },
            { name: 'tablet', width: 768, height: 1024 },
            { name: 'desktop', width: 1280, height: 720 },
          ];
          for (const viewport of viewports) {
            test('NexaAI ' + viewport.name + ' has no horizontal overflow and exposes Direct mode', async ({ browser }) => {
              const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height } });
              const errors = [];
              page.on('pageerror', e => errors.push('pageerror: ' + e.message));
              page.on('console', m => { if (m.type() === 'error') errors.push('console: ' + m.text()); });
              await page.goto(process.env.VERCEL_URL, { waitUntil: 'domcontentloaded', timeout: 30000 });
              await expect(page.getByText('NexaAI', { exact: true }).first()).toBeVisible();
              const dimensions = await page.evaluate(() => { const offenders = Array.from(document.querySelectorAll('*')).map(el => { const rect = el.getBoundingClientRect(); return { tag: el.tagName, cls: el.className?.toString?.() || '', right: Math.round(rect.right), width: Math.round(rect.width) }; }).filter(x => x.right > window.innerWidth + 1).sort((a,b) => b.right - a.right).slice(0,10); return { innerWidth: window.innerWidth, scrollWidth: document.documentElement.scrollWidth, offenders }; });
              console.log(JSON.stringify(dimensions));
              expect(dimensions.scrollWidth).toBeLessThanOrEqual(dimensions.innerWidth + 1);
              await page.getByRole('button', { name: 'Start building' }).first().click();
              await expect(page.getByText('NexaAI Direct', { exact: true })).toBeVisible();
              expect(errors).toEqual([]);
              await page.close();
            });
          }
          EOF
          npx playwright@latest test .nexaai-responsive.spec.mjs --reporter=line
      - name: Publish smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state="failure"
          if [ "$JOB_STATUS" = "success" ]; then state="success"; fi
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "$(jq -n --arg state "$state" '{state:$state,context:"NexaAI smoke",description:"Build, tests, Vercel API boundary and browser smoke"}')"
