name: NexaAI Vercel Smoke

on:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wait for Vercel deployment and discover URL
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            "https://nexa-ai.vercel.app"
            "https://nexa-ai-git-main-nuspat83-9991.vercel.app"
          )
          for attempt in $(seq 1 60); do
            for base in "${urls[@]}"; do
              status=$(curl -sS -L -o /tmp/health.json -w '%{http_code}' "$base/api/health" || true)
              if [ "$status" = "200" ] && grep -q '"ok":true' /tmp/health.json; then
                echo "VERCEL_URL=$base" >> "$GITHUB_ENV"
                cat /tmp/health.json
                exit 0
              fi
              echo "Not healthy: $base (attempt $attempt, status $status): $(cat /tmp/health.json 2>/dev/null || true)"
            done
            sleep 5
          done
          echo "No public NexaAI Vercel URL exposed a healthy /api/health endpoint."
          exit 1

      - name: Install Playwright Chromium
        run: npx playwright@latest install --with-deps chromium

      - name: Verify homepage and builder
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/nexaai-smoke.spec.mjs <<'EOF'
          import { test, expect } from 'playwright/test';

          test('homepage loads, builder opens, and page has no immediate runtime errors', async ({ page }) => {
            const errors = [];
            page.on('pageerror', error => errors.push(`pageerror: ${error.message}`));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(`console: ${message.text()}`);
            });

            await page.goto(process.env.VERCEL_URL, {
              waitUntil: 'networkidle',
              timeout: 30_000,
            });
            await expect(page.getByText('NexaAI', { exact: true }).first()).toBeVisible();
            await expect(page.getByRole('heading', { name: 'Make your business look the part.' })).toBeVisible();

            await page.getByRole('button', { name: 'Start building' }).click();
            await expect(page.getByText('Category', { exact: true }).first()).toBeVisible();
            await expect(page.getByText('Business', { exact: true }).first()).toBeVisible();

            expect(errors, errors.join('\n')).toEqual([]);
          });
          EOF
          npx playwright@latest test /tmp/nexaai-smoke.spec.mjs --reporter=line
