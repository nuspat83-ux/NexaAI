name: NexaAI Vercel Smoke

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify Vercel homepage and API health
        run: |
          set -euo pipefail
          export VERCEL_URL=https://nexa-ai-git-main-nuspat83-9991.vercel.app
          code=$(curl -sS -L -o /tmp/home.html -w '%{http_code}' "$VERCEL_URL/")
          api=$(curl -sS -L -o /tmp/health.json -w '%{http_code}' "$VERCEL_URL/api/health")
          test "$code" = 200
          test "$api" = 200
          grep -q 'id="root"' /tmp/home.html
          cat /tmp/health.json
          echo "VERCEL_URL=$VERCEL_URL" >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        run: npx playwright@latest install --with-deps chromium

      - name: Verify homepage and builder
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/nexaai-smoke.spec.mjs <<'EOF'
          import { test, expect } from 'playwright/test';
          test('NexaAI homepage and builder have no immediate runtime errors', async ({ page }) => {
            const errors = [];
            page.on('pageerror', e => errors.push(`pageerror: ${e.message}`));
            page.on('console', m => { if (m.type() === 'error') errors.push(`console: ${m.text()}`); });
            await page.goto(process.env.VERCEL_URL, { waitUntil: 'networkidle', timeout: 30000 });
            await expect(page.getByText('NexaAI', { exact: true }).first()).toBeVisible();
            await expect(page.getByRole('heading', { name: 'Make your business look the part.' })).toBeVisible();
            await page.getByRole('button', { name: 'Start building' }).click();
            await expect(page.getByText('Category', { exact: true }).first()).toBeVisible();
            await expect(page.getByText('Business', { exact: true }).first()).toBeVisible();
            expect(errors, errors.join('\\n')).toEqual([]);
          });
          EOF
          npx playwright@latest test /tmp/nexaai-smoke.spec.mjs --reporter=line
